<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULP FUSION — Say 'Crushed' One More Time</title>
<meta name="description" content="A tiny fruit puzzle about greed. Drop fruit, fuse twins, press the harvest — and never let the crate crest the DO NOT CROSS line.">
<meta name="theme-color" content="#f7ecd7">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PULP FUSION">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Black&family=Nunito:wght@700;900&family=VT323&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; overflow-x:hidden;
    background:#f7ecd7; color:#3a2b20;
    font-family:'Archivo', sans-serif; position:relative;
  }
  a { color:inherit; }

  /* ── decor: drift of fruit falling forever ── */
  #fruitFall { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .ff { position:absolute; top:-60px; border-radius:50%;
        box-shadow:inset -8px -12px 0 rgba(58,43,32,.14);
        animation:ff-fall linear infinite, ff-sway ease-in-out infinite alternate; opacity:.85; }
  @keyframes ff-fall { from { transform:translateY(-8vh) rotate(0); } to { transform:translateY(108vh) rotate(220deg); } }
  @keyframes ff-sway { from { margin-left:-18px; } to { margin-left:26px; } }

  /* ── header ── */
  header { position:relative; z-index:2; text-align:center; padding:64px 20px 24px; }
  .est {
    font-family:'VT323', monospace; font-size:15px; letter-spacing:.45em;
    color:#a08d77; text-transform:uppercase;
  }
  .logo {
    display:inline-block; margin-top:10px;
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(44px,9.5vw,104px); line-height:.95; letter-spacing:.01em;
    color:#3a2b20; transform:rotate(-2deg); position:relative;
    text-shadow:4px 4px 0 #e0533f, 8px 8px 0 #f2d9b4;
  }
  .logo em { font-style:normal; color:#e0533f; text-shadow:4px 4px 0 #3a2b20, 8px 8px 0 #f2d9b4; }
  /* bobbing letters */
  .logo .ripple { display:inline-block; animation:bop 2.4s ease-in-out infinite; }
  .logo .ripple:nth-child(odd) { animation-delay:.15s; }
  @keyframes bop { 50% { transform:translateY(-7px) rotate(-4deg); } }
  .tagline {
    margin-top:26px; font-family:'Nunito'; font-weight:900;
    font-size:clamp(13px,2.4vw,17px); letter-spacing:.28em; color:#a04b3b;
  }
  .tagline::before, .tagline::after { content:' ✦ '; color:#e0533f; }

  /* ── play CTA ── */
  .playwrap { position:relative; z-index:2; text-align:center; margin-top:30px; }
  .play {
    display:inline-block; text-decoration:none;
    font-family:'Archivo Black'; font-size:clamp(19px,3.4vw,26px); letter-spacing:.1em;
    color:#fff7ec; background:#e0533f; padding:19px 64px; border-radius:60px;
    box-shadow:0 7px 0 #a83324, 0 16px 30px rgba(58,43,32,.28);
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .play:hover { transform:translateY(-3px) scale(1.02); background:#ef5d47; box-shadow:0 10px 0 #a83324, 0 20px 36px rgba(58,43,32,.32); }
  .play:active { transform:translateY(4px); box-shadow:0 3px 0 #a83324; }
  .playhint {
    margin-top:14px; font-family:'VT323', monospace; font-size:16px; color:#a08d77;
    letter-spacing:.25em;
  }
  .playhint b { color:#e0533f; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.15; } }

  /* ── score plaque ── */
  .plaque {
    position:relative; z-index:2; margin:44px auto 0; width:max-content; max-width:90vw;
    background:#fff7ec; border:3px solid #3a2b20; border-radius:18px;
    padding:16px 40px; text-align:center; transform:rotate(-1deg);
    box-shadow:0 6px 0 #e8d9bd, 0 14px 30px rgba(58,43,32,.12);
  }
  .plaque .l { font-family:'Nunito'; font-weight:700; font-size:11px; letter-spacing:.35em; color:#8a7663; }
  .plaque .v { font-family:'Archivo Black'; font-size:36px; margin-top:2px; color:#3a2b20; }
  .plaque .v small { font-size:15px; color:#a08d77; }

  /* ── versions shelf ── */
  .shelfwrap { position:relative; z-index:2; max-width:900px; margin:56px auto 0; padding:0 22px 20px; }
  .shelftitle {
    display:flex; align-items:center; gap:16px;
    font-family:'VT323', monospace; font-size:21px; letter-spacing:.35em; color:#a08d77;
  }
  .shelftitle::before, .shelftitle::after { content:''; flex:1; height:2px; background:#e8d9bd; }
  .shelf { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:20px; margin-top:24px; }

  .ver {
    position:relative; text-decoration:none; display:block;
    background:#fff7ec; border:3px solid #3a2b20; border-radius:16px;
    padding:20px 20px 18px; text-align:left;
    box-shadow:0 5px 0 #e8d9bd;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .ver:hover { transform:translateY(-5px) rotate(-.6deg); box-shadow:0 10px 0 #e8d9bd, 0 18px 34px rgba(58,43,32,.14); }
  .ver .badge {
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    background:#3a2b20; color:#fff7ec;
    font-family:'VT323', monospace; font-size:12px; letter-spacing:.3em;
    padding:3px 14px 4px; border-radius:20px; white-space:nowrap;
  }
  .ver .rib {
    position:absolute; top:-12px; right:14px; transform:rotate(8deg);
    background:#e0533f; color:#fff7ec;
    font-family:'Nunito'; font-weight:900; font-size:10.5px; letter-spacing:.2em;
    padding:4px 12px; border-radius:8px;
  }
  .ver .name { font-family:'Archivo Black'; font-size:20px; letter-spacing:.02em; color:#3a2b20; }
  .ver .name em { font-style:normal; color:#e0533f; }
  .ver .tagline { margin-top:7px; font-size:13px; font-weight:700; color:#8a7663; line-height:1.55; }
  .ver .foot {
    margin-top:14px; display:flex; justify-content:space-between; align-items:center;
    font-family:'VT323', monospace; font-size:14px; letter-spacing:.15em; color:#a08d77;
  }
  .ver .foot b { color:#e0533f; }
  .ver.og { border-color:#e0533f; box-shadow:0 5px 0 #a83324; }
  .ver.og:hover { box-shadow:0 10px 0 #a83324, 0 18px 34px rgba(58,43,32,.16); }

  .ver.empty {
    border-style:dashed; border-width:2px; border-color:#d8c6a8;
    box-shadow:none; background:transparent; color:#b3a38b;
    display:flex; flex-direction:column; justify-content:center; text-align:center; gap:6px;
    cursor:default; min-height:150px;
  }
  .ver.empty:hover { transform:none; box-shadow:none; }
  .ver.empty .name { color:#b9a88d; font-size:16px; }
  .ver.empty .tagline { color:#c3b39a; font-family:'VT323', monospace; letter-spacing:.25em; font-size:14px; }

  /* ── footer ── */
  footer {
    position:relative; z-index:2; margin-top:70px; padding:26px 20px 40px;
    text-align:center; border-top:3px solid #e8d9bd;
  }
  .lab {
    font-family:'Nunito'; font-weight:700; font-size:12px; letter-spacing:.35em;
    color:#a08d77; text-transform:uppercase;
  }
  .lab b { color:#3a2b20; font-weight:900; }
  .lab .dot { color:#e0533f; }

  .fruitFall, #fruitFall { z-index:0; }

/* install pill */
#installBtn {
  display:none; margin-top:18px;
  font-family:'VT323', monospace; font-size:18px; letter-spacing:.25em;
  color:#8a5a4a; text-decoration:none; cursor:pointer;
  border:2px dashed #d8a89a; border-radius:40px; padding:8px 26px;
  background:#fff7ecaa; transition:all .15s;
}
#installBtn.show { display:inline-block; animation:wig 2.4s ease-in-out infinite; }
#installBtn:hover { color:#fff7ec; background:#e0533f; border-color:#e0533f; }
#installHint {
  margin-top:14px; font-family:'VT323', monospace; font-size:15px;
  color:#a08d77; letter-spacing:.12em; line-height:1.7;
}
#installHint b { color:#e0533f; }
@keyframes wig { 25% { transform:rotate(-1.2deg); } 75% { transform:rotate(1.2deg); } }

@media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="fruitFall"></div>

<header>
  <div class="est">A FRESH CRATE, DAILY · EST. 2026</div>
  <div class="logo">PULP&nbsp;<em><span class="ripple">F</span><span class="ripple">U</span><span class="ripple">S</span><span class="ripple">I</span><span class="ripple">O</span><span class="ripple">N</span></em></div>
  <div class="tagline">SAY 'CRUSHED' ONE MORE TIME.</div>
</header>

<div class="playwrap">
  <a class="play" href="./pulp-fusion.html">▶&nbsp; PLAY ORIGINAL</a>
  <div class="playhint">AIM & CLICK TO DROP · <b>ONE PULSE AT A TIME</b></div>
<a id="installBtn" href="#">⤓&nbsp; INSTALL APP</a>
<div id="installHint"></div>
</div>

<div class="plaque">
  <div class="l">LEGENDARY BEST — ORIGINAL</div>
  <div class="v"><span id="bestScore">—</span> <small>PTS</small></div>
</div>

<div class="shelfwrap">
  <div class="shelftitle">THE VERSION SHELF</div>
  <div class="shelf" id="shelf"></div>
</div>

<footer>
  <div class="lab">PULP FUSION <span class="dot">◆</span> PRODUCT OF <b>AHZAB LAB</b> <span class="dot">◆</span> SERVED FRESH SINCE RIPE</div>
</footer>

<script>
(() => {
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ── falling fruit decor ── */
  (function fruitFall() {
    const box = document.getElementById('fruitFall');
    const colors = ['#e0475c','#ef5872','#9a5bd6','#f3c93e','#f2913d','#e05a4e','#b9d054','#f6a8b4'];
    for (let i = 0; i < 22; i++) {
      const f = document.createElement('span');
      f.className = 'ff';
      const s = rand(16, 44);
      f.style.width = s + 'px'; f.style.height = s + 'px';
      f.style.left = (Math.random() * 100) + 'vw';
      f.style.background = colors[i % colors.length];
      f.style.opacity = (rand(.18, .5)).toFixed(2);
      f.style.animationDuration = `${rand(9, 20).toFixed(1)}s, ${rand(2.6, 5).toFixed(1)}s`;
      f.style.animationDelay = `${(-Math.random() * 20).toFixed(1)}s, ${rand(-3, 0).toFixed(1)}s`;
      box.appendChild(f);
    }
  })();

  /* ── best score ── */
  let best = null;
  try { best = localStorage.getItem('pulp-fusion-best'); } catch (e) {}
  if (best !== null && best !== '') document.getElementById('bestScore').textContent = Number(best).toLocaleString();

  /* ── THE VERSION SHELF ──────────────────────────────────────────────
     To add a new version of PULP FUSION:
       1. drop its HTML file in this folder (it will keep its own score
          key, ideally `pulp-fusion-<id>-best`)
       2. add ONE line below:
          { id:'remix', file:'pulp-fusion-remix.html', name:'REMIX',
            tagline:'...', key:'pulp-fusion-remix-best', live:true }
     The ORIGINAL is pinned and always playable.                               */
  const VERSIONS = [
    { id:'og', file:'pulp-fusion.html', name:'ORIGINAL',
      tagline:'The classic crush. Aim, drop, fuse — and never let the crate crest the DO NOT CROSS line.',
      key:'pulp-fusion-best', pinned:true, live:true },
    // future versions — add the line, the shelf renders it:
    // { id:'remix', file:'pulp-fusion-remix.html', name:'REMIX', tagline:'…', key:'pulp-fusion-remix-best', live:true },
    // { id:'blitz',  file:'pulp-fusion-blitz.html',  name:'BLITZ',  tagline:'…', key:'pulp-fusion-blitz-best',  live:true },
  ];
  const EMPTY_SLOTS = Math.max(0, 3 - VERSIONS.filter(v => v.live).length); // pad the shelf to 3 seats

  const shelf = document.getElementById('shelf');
  VERSIONS.forEach(v => {
    const el = document.createElement('a');
    el.className = 'ver' + (v.pinned ? ' og' : '');
    el.href = v.file;
    el.title = v.name + ' — ' + v.tagline;
    let score = '—';
    try { const s = localStorage.getItem(v.key); if (s) score = Number(s).toLocaleString(); } catch (e) {}
    el.innerHTML = `
      ${v.pinned ? '<span class="badge">OG · PINNED</span>' : ''}
      <div class="name">${v.name.includes('OG') || v.name.includes('ORIGINAL') ? 'ORIGINAL' : v.name}</div>
      <div class="tagline">${v.tagline}</div>
      <div class="foot"><span>BEST <b>${score}</b></span><span>${v.live ? 'PLAY ▸' : 'SOON'}</span></div>`;
    shelf.appendChild(el);
  });
  for (let i = 0; i < EMPTY_SLOTS; i++) {
    const el = document.createElement('div');
    el.className = 'ver empty';
    el.innerHTML = `<div class="tagline">— EMPTY CRATE —</div><div class="name">A FUTURE VERSION SITS HERE</div>`;
    shelf.appendChild(el);
  }
})();

</script>
<script src="./install.js"></script>
</body>
</html>
